[package]
name = "docpdf"
version = "0.2.0"
edition = "2024"
description = "Foto di documenti in un'unica pagina PDF A4"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "rayon"] }
imageproc = { version = "0.27", default-features = false, features = ["rayon"] }
ocrs = { version = "0.13", default-features = false, features = ["onnx"] }
rten = { version = "0.26", default-features = false, features = ["onnx_format"] }
rten-tensor = "0.26"
rten-imageproc = "0.26"
pdf-writer = "0.15"
rayon = "1.12"
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "async-std"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 2
